<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.json">
<title>家計簿 - 25日起算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:#0a0a1a;color:#e0e0ff;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;min-height:100vh;overscroll-behavior:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2d2d4e;border-radius:2px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.8)}
select option{background:#1a1a2e}
input,select,button{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

// ===== STORAGE =====
const S = {
  get:(k)=>{try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,v);return true;}catch{return false;}},
  del:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

// ===== UTILS =====
function weekPeriods(y,m){
  // 固定4区間: 25〜3, 4〜10, 11〜17, 18〜24
  const nm=m===11?0:m+1, ny=m===11?y+1:y;
  return [
    {s:new Date(y,m,25),  e:new Date(ny,nm,3)},
    {s:new Date(ny,nm,4), e:new Date(ny,nm,10)},
    {s:new Date(ny,nm,11),e:new Date(ny,nm,17)},
    {s:new Date(ny,nm,18),e:new Date(ny,nm,24)},
  ];
}
function dkey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function drange(s,e){const a=[];let c=new Date(s);while(c<=e){a.push(new Date(c));c.setDate(c.getDate()+1);}return a;}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`;}
function cycleLabel(y,m){const nm=m===11?0:m+1,ny=m===11?y+1:y;return `${y}年${m+1}月25日〜${ny}年${nm+1}月24日`;}
const WEEK=['日','月','火','水','木','金','土'];

// ===== DEFAULTS =====
const DEF_FIXED=[
  {id:'fc1',name:'家賃',cat:'住居費',day:25,amt:80000},
  {id:'fc2',name:'返済',cat:'ローン',day:25,amt:30000},
  {id:'fc3',name:'携帯',cat:'通信費',day:10,amt:8000},
  {id:'fc4',name:'定期代',cat:'交通費',day:10,amt:12000},
  {id:'fc5',name:'クレカ決済（固定）',cat:'その他',day:10,amt:0,bd:true},
  {id:'fc5b',name:'クレカ決済（臨時）',cat:'その他',day:10,amt:0,bd:true},
  {id:'fc6',name:'ヘアカット',cat:'美容費',day:null,amt:4000},
  {id:'fc7',name:'眉毛サロン',cat:'美容費',day:null,amt:3000},
  {id:'fc8',name:'脱毛',cat:'美容費',day:null,amt:5000},
  {id:'fc9',name:'保険',cat:'保険',day:null,amt:15000},
  {id:'fc10',name:'体メンテ',cat:'健康費',day:null,amt:8000},
];
const CATS={'住居費':'#e74c3c','ローン':'#c0392b','通信費':'#3498db','交通費':'#2980b9','美容費':'#e91e63','保険':'#9b59b6','健康費':'#27ae60','食費':'#f39c12','娯楽費':'#1abc9c','その他':'#95a5a6'};
const ACATS=Object.keys(CATS);
const ECATS=['食費','外食費','交通費','日用品','娯楽費','医療費','衣服費','その他'];

// ===== UI PARTS =====
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#1a1a2e',border:'1px solid #2d2d4e',borderRadius:'16px',padding:'24px',maxWidth:'500px',width:'100%',maxHeight:'88vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <h3 style={{margin:0,color:'#e0e0ff',fontSize:'17px'}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#888',fontSize:'22px',cursor:'pointer',padding:'4px 8px'}}>✕</button>
      </div>
      {children}
    </div>
  </div>;
}
function Field({label,value,onChange,type='text',placeholder}){
  return <div style={{marginBottom:'14px'}}>
    <label style={{display:'block',color:'#a0a0c0',fontSize:'12px',marginBottom:'6px'}}>{label}</label>
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{width:'100%',background:'#0d0d1a',border:'1px solid #2d2d4e',borderRadius:'8px',padding:'12px',color:'#e0e0ff',fontSize:'16px',outline:'none'}}/>
  </div>;
}
function Sel({label,value,onChange,opts}){
  return <div style={{marginBottom:'14px'}}>
    <label style={{display:'block',color:'#a0a0c0',fontSize:'12px',marginBottom:'6px'}}>{label}</label>
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{width:'100%',background:'#0d0d1a',border:'1px solid #2d2d4e',borderRadius:'8px',padding:'12px',color:'#e0e0ff',fontSize:'16px'}}>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  </div>;
}

// ===== PIN LOCK =====
function PinLock({onUnlock}){
  const [pin,setPin]=useState('');
  const saved=S.get('kpin')?.value;
  const [mode,setMode]=useState(saved?'enter':'setup');
  const [conf,setConf]=useState('');
  const [step,setStep]=useState('first');
  const [err,setErr]=useState('');
  const [shake,setShake]=useState(false);
  const doShake=()=>{setShake(true);setTimeout(()=>setShake(false),500);};
  const tap=n=>{
    if(mode==='enter'){
      const nx=pin+n;setPin(nx);setErr('');
      if(nx.length===4){
        if(nx===saved){setTimeout(()=>onUnlock(),150);}
        else{setTimeout(()=>{doShake();setPin('');setErr('PINが違います');},150);}
      }
    } else {
      if(step==='first'){
        const nx=pin+n;setPin(nx);
        if(nx.length===4){setTimeout(()=>{setConf(nx);setPin('');setStep('confirm');},150);}
      } else {
        const nx=pin+n;setPin(nx);
        if(nx.length===4){
          if(nx===conf){S.set('kpin',conf);setTimeout(()=>onUnlock(),150);}
          else{setTimeout(()=>{doShake();setPin('');setStep('first');setConf('');setErr('一致しません。最初からやり直してください');},150);}
        }
      }
    }
  };
  const del=()=>setPin(p=>p.slice(0,-1));
  const rows=[['1','2','3'],['4','5','6'],['7','8','9'],['','0','⌫']];
  return <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0a0a1a,#0d0d2b)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px'}}>
    <div style={{fontSize:'40px',marginBottom:'12px'}}>💴</div>
    <h1 style={{margin:'0 0 4px',fontSize:'22px',color:'#c0b4ff',fontWeight:700}}>家計簿</h1>
    <p style={{margin:'0 0 40px',fontSize:'12px',color:'#6060a0'}}>25日起算サイクル管理</p>
    <p style={{margin:'0 0 8px',fontSize:'14px',color:'#a0a0c0'}}>
      {mode==='enter'?'PINを入力':step==='first'?'新しいPINを入力（4桁）':'PINをもう一度入力'}
    </p>
    <div style={{display:'flex',gap:'16px',marginBottom:'12px',animation:shake?'shake 0.4s':'none'}}>
      {[0,1,2,3].map(i=><div key={i} style={{width:'16px',height:'16px',borderRadius:'50%',background:i<pin.length?'#c0b4ff':'transparent',border:'2px solid '+(i<pin.length?'#c0b4ff':'#3d3d6e'),transition:'all 0.15s'}}/>)}
    </div>
    {err?<p style={{margin:'0 0 16px',fontSize:'12px',color:'#e74c3c'}}>{err}</p>:<div style={{height:'28px',marginBottom:'16px'}}/>}
    <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
      {rows.map((row,ri)=><div key={ri} style={{display:'flex',gap:'12px'}}>
        {row.map((n,ci)=><button key={ci} onClick={()=>n==='⌫'?del():n?tap(n):null}
          style={{width:'72px',height:'72px',borderRadius:'50%',background:n?'rgba(255,255,255,0.06)':'transparent',border:n?'1px solid #2d2d4e':'none',color:n==='⌫'?'#a0a0c0':'#e0e0ff',fontSize:n==='⌫'?'22px':'24px',fontWeight:600,cursor:n?'pointer':'default',WebkitAppearance:'none'}}>
          {n}
        </button>)}
      </div>)}
    </div>
    <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}`}</style>
  </div>;
}

// ===== MAIN APP =====
function App(){
  const today=new Date();
  const iy=today.getDate()>=25?today.getFullYear():(today.getMonth()===0?today.getFullYear()-1:today.getFullYear());
  const im=today.getDate()>=25?today.getMonth():(today.getMonth()===0?11:today.getMonth()-1);
  const [cy,setCy]=useState(iy);
  const [cm,setCm]=useState(im);
  const ck=`kc_${cy}_${cm}`;
  const dk=`kd_${cy}_${cm}`;

  const [daily,setDaily]=useState({});
  const [fixed,setFixed]=useState(DEF_FIXED);
  const [cstore,setCstore]=useState({});
  const [memos,setMemos]=useState([]);
  const [tab,setTab]=useState('weekly');
  const [exBD,setExBD]=useState({});
  const [editIncome,setEditIncome]=useState(false);
  const [incInput,setIncInput]=useState('');

  // modals
  const [mExp,setMExp]=useState(false);
  const [mFixed,setMFixed]=useState(false);
  const [mEditF,setMEditF]=useState(null);
  const [mTemp,setMTemp]=useState(false);
  const [mOvr,setMOvr]=useState(null);
  const [mMemo,setMMemo]=useState(false);
  const [mDate,setMDate]=useState(null);

  // forms
  const [fExp,setFExp]=useState({date:'',amt:'',cat:'食費',note:'',isBudget:false});
  const [fFixed,setFFixed]=useState({name:'',cat:'その他',day:'',amt:'',bd:false});
  const [fEdit,setFEdit]=useState({name:'',cat:'その他',day:'',amt:'',bd:false});
  const [fTemp,setFTemp]=useState({name:'',cat:'その他',day:'',amt:''});
  const [fOvr,setFOvr]=useState('');
  const [fMemo,setFMemo]=useState({date:'',title:'',amt:'',note:''});
  const [fBD,setFBD]=useState({id:null,name:'',amt:''});

  // load
  useEffect(()=>{
    try{const r=S.get(dk);setDaily(r?JSON.parse(r.value):{});}catch{setDaily({});}
    try{const r=S.get('kf');if(r)setFixed(JSON.parse(r.value));}catch{}
    try{const r=S.get('kcs');if(r)setCstore(JSON.parse(r.value));}catch{}
    try{const r=S.get('km');if(r)setMemos(JSON.parse(r.value));}catch{}
  },[dk]);

  const saveD=d=>{setDaily(d);S.set(dk,JSON.stringify(d));};
  const saveF=d=>{setFixed(d);S.set('kf',JSON.stringify(d));};
  const saveC=d=>{setCstore(d);S.set('kcs',JSON.stringify(d));};
  const saveM=d=>{setMemos(d);S.set('km',JSON.stringify(d));};

  const cyc=cstore[ck]||{ovr:{},tmp:[],bd:{}};
  const updC=p=>saveC({...cstore,[ck]:{...cyc,...p}});

  // income
  const income=cyc.income||0;
  const saveIncome=v=>updC({income:Number(v)||0});

  // effective base amount with permanent changes
  const effBase=f=>{
    const ch=f.perm||[];if(!ch.length)return f.amt;
    const ap=ch.filter(c=>c.y<cy||(c.y===cy&&c.m<=cm)).sort((a,b)=>(b.y*12+b.m)-(a.y*12+a.m));
    return ap.length?ap[0].amt:f.amt;
  };

  // breakdown
  const getBD=id=>(cyc.bd||{})[id]||[];
  const getBDT=id=>{const it=getBD(id);return it.length?it.reduce((s,b)=>s+Number(b.amt),0):null;};
  const addBD=(id,item)=>updC({bd:{...(cyc.bd||{}),[id]:[...getBD(id),item]}});
  const delBD=(id,bid)=>updC({bd:{...(cyc.bd||{}),[id]:getBD(id).filter(b=>b.id!==bid)}});

  // overrides
  const setOvr=(id,p)=>updC({ovr:{...cyc.ovr,[id]:{...(cyc.ovr[id]||{}),...p}}});
  const clrOvr=id=>{const o={...cyc.ovr};delete o[id];updC({ovr:o});};
  const togHide=(id,cur)=>cur?clrOvr(id):setOvr(id,{hidden:true});

  // effective fixed list
  const effFixed=[
    ...fixed.filter(f=>!cyc.ovr[f.id]?.hidden).map(f=>{
      const base=effBase(f);
      const ov=cyc.ovr[f.id]?.amt;
      const bdt=f.bd?getBDT(f.id):null;
      return {...f,effAmt:bdt!==null?bdt:(ov??base),isOvr:ov!==undefined,hasPerm:(f.perm||[]).some(c=>c.y<cy||(c.y===cy&&c.m<=cm))};
    }),
    ...(cyc.tmp||[]).map(t=>({...t,isTemp:true})),
  ];
  const fixedTotal=effFixed.reduce((s,f)=>s+Number(f.effAmt),0);

  // daily helpers
  const getAct=k=>(daily[k]?.exp||[]).reduce((s,e)=>s+Number(e.amt),0);
  const getBgt=k=>daily[k]?.budget||0;
  const periods=weekPeriods(cy,cm);
  const allDates=periods.flatMap(p=>drange(p.s,p.e));
  const cycleTotal=allDates.reduce((s,d)=>s+getAct(dkey(d)),0);
  const cycleBudget=allDates.reduce((s,d)=>s+getBgt(dkey(d)),0);

  const prevC=()=>{if(cm===0){setCy(y=>y-1);setCm(11);}else setCm(m=>m-1);};
  const nextC=()=>{if(cm===11){setCy(y=>y+1);setCm(0);}else setCm(m=>m+1);};

  // handlers
  const addExp=()=>{
    if(!fExp.date||!fExp.amt)return;
    const nd={...daily};if(!nd[fExp.date])nd[fExp.date]={exp:[],budget:0};
    if(fExp.isBudget)nd[fExp.date].budget=Number(fExp.amt);
    else nd[fExp.date].exp=[...(nd[fExp.date].exp||[]),{id:Date.now(),amt:Number(fExp.amt),cat:fExp.cat,note:fExp.note}];
    saveD(nd);setFExp({date:'',amt:'',cat:'食費',note:'',isBudget:false});setMExp(false);
  };
  const delExp=(k,id)=>{const nd={...daily};if(nd[k])nd[k].exp=nd[k].exp.filter(e=>e.id!==id);saveD(nd);};
  const addFixed=()=>{
    if(!fFixed.name||!fFixed.amt)return;
    saveF([...fixed,{id:`fc${Date.now()}`,name:fFixed.name,cat:fFixed.cat,day:fFixed.day?Number(fFixed.day):null,amt:Number(fFixed.amt),bd:fFixed.bd}]);
    setFFixed({name:'',cat:'その他',day:'',amt:'',bd:false});setMFixed(false);
  };
  const delFixed=id=>saveF(fixed.filter(f=>f.id!==id));
  const openEdit=f=>{setFEdit({name:f.name,cat:f.cat,day:f.day!=null?String(f.day):'',amt:String(f.amt),bd:f.bd||false});setMEditF(f);};
  const updFixed=()=>{
    if(!fEdit.name||!fEdit.amt)return;
    saveF(fixed.map(f=>f.id===mEditF.id?{...f,name:fEdit.name,cat:fEdit.cat,day:fEdit.day?Number(fEdit.day):null,amt:Number(fEdit.amt),bd:fEdit.bd}:f));
    setMEditF(null);
  };
  const addTemp=()=>{
    if(!fTemp.name||!fTemp.amt)return;
    updC({tmp:[...(cyc.tmp||[]),{id:`tmp${Date.now()}`,name:fTemp.name,cat:fTemp.cat,day:fTemp.day?Number(fTemp.day):null,amt:Number(fTemp.amt)}]});
    setFTemp({name:'',cat:'その他',day:'',amt:''});setMTemp(false);
  };
  const delTemp=id=>updC({tmp:(cyc.tmp||[]).filter(t=>t.id!==id)});
  const saveOvrMonth=()=>{if(!mOvr||!fOvr)return;setOvr(mOvr.id,{amt:Number(fOvr)});setMOvr(null);setFOvr('');};
  const savePerm=()=>{
    if(!mOvr||!fOvr)return;
    const prev=mOvr.perm||[];
    const filt=prev.filter(c=>!(c.y===cy&&c.m===cm));
    saveF(fixed.map(f=>f.id===mOvr.id?{...f,perm:[...filt,{y:cy,m:cm,amt:Number(fOvr)}]}:f));
    setMOvr(null);setFOvr('');
  };
  const addMemo=()=>{if(!fMemo.date||!fMemo.title)return;saveM([...memos,{id:Date.now(),...fMemo}]);setFMemo({date:'',title:'',amt:'',note:''});setMMemo(false);};
  const delMemo=id=>saveM(memos.filter(m=>m.id!==id));
  const addBDItem=fid=>{if(!fBD.name||!fBD.amt)return;addBD(fid,{id:`bd${Date.now()}`,name:fBD.name,amt:Number(fBD.amt)});setFBD({id:null,name:'',amt:''});};

  const tk=dkey(today);
  const futureMemos=memos.filter(m=>m.date>=tk).sort((a,b)=>a.date.localeCompare(b.date));
  const pastMemos=memos.filter(m=>m.date<tk).sort((a,b)=>b.date.localeCompare(a.date));

  // クレカ集計
  const ccItems=fixed.filter(f=>f.bd&&f.name.includes('クレカ'));
  const ccTotal=ccItems.filter(f=>!cyc.ovr[f.id]?.hidden).flatMap(f=>getBD(f.id)).reduce((s,b)=>s+Number(b.amt),0);

  const dayGroups=[25,10,...([...new Set(fixed.map(f=>f.day))].filter(d=>d!==25&&d!==10).sort((a,b)=>a===null?1:b===null?-1:a-b))];

  const balance=income-fixedTotal-cycleTotal;

  // styles
  const PB={background:'linear-gradient(135deg,#3d2d8e,#5d3d9e)',border:'1px solid #6d4dae',color:'#e0d4ff',borderRadius:'10px',padding:'10px 18px',cursor:'pointer',fontSize:'14px',display:'flex',alignItems:'center',gap:'4px',fontWeight:500,WebkitAppearance:'none'};
  const SB=(bc,c)=>({background:'none',border:`1px solid ${bc}`,color:c,borderRadius:'6px',padding:'5px 9px',cursor:'pointer',fontSize:'12px',WebkitAppearance:'none'});
  const NB={background:'rgba(255,255,255,0.05)',border:'1px solid #2d2d4e',color:'#a0a0d0',borderRadius:'10px',padding:'8px 16px',cursor:'pointer',fontSize:'20px',lineHeight:1,WebkitAppearance:'none'};
  const INS={background:'#0d0d1a',border:'1px solid rgba(26,188,156,0.3)',borderRadius:'6px',padding:'9px 10px',color:'#e0e0ff',fontSize:'14px',outline:'none'};

  return <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0a0a1a,#0d0d2b,#0a0a1a)',color:'#e0e0ff',paddingBottom:'env(safe-area-inset-bottom)'}}>

    {/* HEADER */}
    <div style={{background:'rgba(13,13,42,0.95)',backdropFilter:'blur(12px)',borderBottom:'1px solid #2d2d4e',padding:'14px 16px',position:'sticky',top:0,zIndex:100,paddingTop:'calc(14px + env(safe-area-inset-top))'}}>
      <div style={{maxWidth:'600px',margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <h1 style={{margin:0,fontSize:'20px',fontWeight:700,color:'#c0b4ff'}}>💴 家計簿</h1>
            <div style={{fontSize:'11px',color:'#6060a0',marginTop:'1px'}}>25日起算サイクル管理</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
            <button onClick={prevC} style={NB}>‹</button>
            <div style={{fontSize:'13px',color:'#a0a0d0',minWidth:'110px',textAlign:'center'}}>{cy}年{cm+1}月〜</div>
            <button onClick={nextC} style={NB}>›</button>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginTop:'12px'}}>
          {[['支出合計',cycleTotal,'#e74c3c'],['固定費',fixedTotal,'#9b59b6'],['収入',income,'#27ae60']].map(([l,v,c])=>(
            <div key={l} style={{background:'rgba(255,255,255,0.04)',borderRadius:'10px',padding:'10px',border:'1px solid #2d2d4e'}}>
              <div style={{fontSize:'10px',color:'#6060a0',marginBottom:'3px'}}>{l}</div>
              <div style={{fontSize:'15px',fontFamily:"'Space Mono',monospace",color:c,fontWeight:700}}>¥{v.toLocaleString()}</div>
            </div>
          ))}
        </div>
        {income>0&&<div style={{marginTop:'10px',background:'rgba(255,255,255,0.03)',borderRadius:'10px',padding:'10px 12px',border:'1px solid #2d2d4e'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}}>

                        <button onClick={()=>delBD(f.id,b.id)} style={{background:'none',border:'none',color:'#406050',cursor:'pointer',fontSize:'16px',padding:'0 4px'}}>✕</button>

                <span style={{fontSize:'12px',fontFamily:"'Space Mono',monospace",color:isHid?'#404060':'#a0d0c8'}}>¥{sum.toLocaleString()}</span>
              </div>;

          <div style={{borderTop:'1px solid rgba(26,188,156,0.2)',paddingTop:'8px',marginTop:'4px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:'13px',color:'#1abc9c',fontWeight:600}}>合計</span>
            <span style={{fontSize:'18px',fontFamily:"'Space Mono',monospace",color:'#1abc9c',fontWeight:700}}>¥{ccTotal.toLocaleString()}</span>
          </div>
        </div>

        </div>
      </div>}

      {/* ===== MEMO ===== */}
      {tab==='memo'&&<div style={{padding:'14px 0'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>

            <button onClick={()=>{if(window.confirm('PINを変更しますか？\n次回起動時に新しいPINを設定します。')){S.del('kpin');window.location.reload();}}}
              style={{...PB,justifyContent:'center',background:'linear-gradient(135deg,#2d3d8e,#3d5d9e)',border:'1px solid #4d6dae'}}>PINを変更する</button>
            <button onClick={()=>{if(window.confirm('PINロックを解除しますか？')){S.del('kpin');alert('PINロックを解除しました');}}}
              style={{background:'none',border:'1px solid #5e3d3d',color:'#a06060',borderRadius:'10px',padding:'10px 18px',cursor:'pointer',fontSize:'14px',WebkitAppearance:'none'}}>PINロックを解除する</button>
          </div>
        </div>
        <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid #2d2d4e',borderRadius:'12px',padding:'16px'}}>
          <div style={{fontSize:'14px',color:'#c0b4ff',fontWeight:600,marginBottom:'12px'}}>ℹ️ アプリ情報</div>
          <div style={{fontSize:'12px',color:'#6060a0',lineHeight:'1.8'}}>
            <div>家計簿アプリ - 25日起算サイクル管理</div>
            <div>データはこのスマホ本体に保存されます</div>
          </div>
        </div>
      </div>}
    </div>

    {/* ===== MODALS ===== */}

    {/* 日別明細 */}
    <Modal open={!!mDate} onClose={()=>setMDate(null)} title={mDate?mDate.replace(/-/g,'/')+'の明細':''}>
      {mDate&&(()=>{
        const exps=daily[mDate]?.exp||[];
        return <div>
          <div style={{display:'flex',justifyContent:'space-between',background:'rgba(255,255,255,0.04)',borderRadius:'8px',padding:'12px',marginBottom:'14px'}}>
            <div><div style={{fontSize:'11px',color:'#6060a0'}}>支出合計</div><div style={{fontSize:'20px',fontFamily:"'Space Mono',monospace",color:'#e74c3c',fontWeight:700}}>¥{getAct(mDate).toLocaleString()}</div></div>
            <div style={{textAlign:'right'}}><div style={{fontSize:'11px',color:'#6060a0'}}>予算</div><div style={{fontSize:'20px',fontFamily:"'Space Mono',monospace",color:'#3498db',fontWeight:700}}>¥{getBgt(mDate).toLocaleString()}</div></div>
          </div>
          {exps.length===0?<div style={{color:'#404060',textAlign:'center',padding:'20px'}}>支出なし</div>
            :exps.map(e=><div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',borderRadius:'8px',background:'rgba(255,255,255,0.03)',marginBottom:'6px',border:'1px solid #2d2d4e'}}>
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                <span style={{background:(CATS[e.cat]||'#95a5a6')+'30',color:CATS[e.cat]||'#95a5a6',fontSize:'11px',padding:'2px 6px',borderRadius:'4px'}}>{e.cat}</span>
                {e.note&&<span style={{fontSize:'13px',color:'#c0c0e0'}}>{e.note}</span>}
              </div>
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                <span style={{fontFamily:"'Space Mono',monospace",fontSize:'14px'}}>¥{Number(e.amt).toLocaleString()}</span>
                <button onClick={()=>delExp(mDate,e.id)} style={{background:'none',border:'1px solid #3d3d5e',color:'#e74c3c',borderRadius:'4px',padding:'4px 8px',cursor:'pointer',fontSize:'13px',WebkitAppearance:'none'}}>✕</button>
              </div>
            </div>)
          }
          <button onClick={()=>{setFExp(f=>({...f,date:mDate}));setMDate(null);setMExp(true);}} style={{...PB,width:'100%',marginTop:'12px',justifyContent:'center'}}>＋ この日に支出追加</button>
        </div>;
      })()}
    </Modal>

    {/* 支出追加 */}
    <Modal open={mExp} onClose={()=>setMExp(false)} title="支出・予算を追加">
      <div style={{display:'flex',gap:'8px',marginBottom:'16px'}}>
        {[false,true].map(ib=><button key={String(ib)} onClick={()=>setFExp(f=>({...f,isBudget:ib}))} style={{flex:1,padding:'10px',background:fExp.isBudget===ib?'#2d2d5e':'transparent',border:`1px solid ${fExp.isBudget===ib?'#4d4d9e':'#2d2d4e'}`,borderRadius:'8px',color:fExp.isBudget===ib?'#c0b4ff':'#606080',cursor:'pointer',fontSize:'14px',WebkitAppearance:'none'}}>
          {ib?'📊 予算設定':'💸 支出記録'}
        </button>)}
      </div>
      <Field label="日付" value={fExp.date} onChange={v=>setFExp(f=>({...f,date:v}))} type="date"/>
      <Field label="金額" value={fExp.amt} onChange={v=>setFExp(f=>({...f,amt:v}))} type="number" placeholder="0"/>
      {!fExp.isBudget&&<><Sel label="カテゴリ" value={fExp.cat} onChange={v=>setFExp(f=>({...f,cat:v}))} opts={ECATS}/><Field label="メモ（任意）" value={fExp.note} onChange={v=>setFExp(f=>({...f,note:v}))} placeholder="内容を入力"/></>}
      <button onClick={addExp} style={{...PB,width:'100%',justifyContent:'center'}}>保存</button>
    </Modal>

    {/* 固定費追加 */}
    <Modal open={mFixed} onClose={()=>setMFixed(false)} title="固定費を追加">
      <Field label="項目名" value={fFixed.name} onChange={v=>setFFixed(f=>({...f,name:v}))} placeholder="例: Netflix"/>
      <Sel label="カテゴリ" value={fFixed.cat} onChange={v=>setFFixed(f=>({...f,cat:v}))} opts={ACATS}/>
      <Field label="引落日（任意）" value={fFixed.day} onChange={v=>setFFixed(f=>({...f,day:v}))} type="number" placeholder="例: 25"/>
      <Field label="金額" value={fFixed.amt} onChange={v=>setFFixed(f=>({...f,amt:v}))} type="number" placeholder="0"/>
      <label style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px',cursor:'pointer',fontSize:'14px',color:'#a0a0c0'}}>
        <input type="checkbox" checked={fFixed.bd} onChange={e=>setFFixed(f=>({...f,bd:e.target.checked}))} style={{width:'18px',height:'18px'}}/>内訳入力を有効にする
      </label>
      <button onClick={addFixed} style={{...PB,width:'100%',justifyContent:'center'}}>追加</button>
    </Modal>

    {/* 固定費編集 */}
    <Modal open={!!mEditF} onClose={()=>setMEditF(null)} title="固定費を編集">
      <Field label="項目名" value={fEdit.name} onChange={v=>setFEdit(f=>({...f,name:v}))}/>
      <Sel label="カテゴリ" value={fEdit.cat} onChange={v=>setFEdit(f=>({...f,cat:v}))} opts={ACATS}/>
      <Field label="引落日（任意）" value={fEdit.day} onChange={v=>setFEdit(f=>({...f,day:v}))} type="number" placeholder="例: 25"/>
      <Field label="金額" value={fEdit.amt} onChange={v=>setFEdit(f=>({...f,amt:v}))} type="number" placeholder="0"/>
      <label style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px',cursor:'pointer',fontSize:'14px',color:'#a0a0c0'}}>
        <input type="checkbox" checked={fEdit.bd} onChange={e=>setFEdit(f=>({...f,bd:e.target.checked}))} style={{width:'18px',height:'18px'}}/>内訳入力を有効にする
      </label>
      <div style={{display:'flex',gap:'8px'}}>
        <button onClick={()=>setMEditF(null)} style={{flex:1,background:'transparent',border:'1px solid #3d3d5e',color:'#808090',borderRadius:'8px',padding:'12px',cursor:'pointer',fontSize:'14px',WebkitAppearance:'none'}}>キャンセル</button>
        <button onClick={updFixed} style={{...PB,flex:2,justifyContent:'center'}}>保存する</button>
      </div>
    </Modal>

    {/* 臨時支出 */}
    <Modal open={mTemp} onClose={()=>setMTemp(false)} title="今月の臨時支出を追加">
      <div style={{background:'rgba(243,156,18,0.08)',border:'1px solid rgba(243,156,18,0.2)',borderRadius:'8px',padding:'10px 12px',marginBottom:'14px',fontSize:'13px',color:'#c09040'}}>このサイクルのみ表示されます</div>
      <Field label="項目名" value={fTemp.name} onChange={v=>setFTemp(f=>({...f,name:v}))} placeholder="例: 旅行積立"/>
      <Sel label="カテゴリ" value={fTemp.cat} onChange={v=>setFTemp(f=>({...f,cat:v}))} opts={ACATS}/>
      <Field label="引落日（任意）" value={fTemp.day} onChange={v=>setFTemp(f=>({...f,day:v}))} type="number" placeholder="例: 15"/>
      <Field label="金額" value={fTemp.amt} onChange={v=>setFTemp(f=>({...f,amt:v}))} type="number" placeholder="0"/>
      <button onClick={addTemp} style={{...PB,width:'100%',justifyContent:'center',background:'linear-gradient(135deg,#8e5d00,#b07a10)',border:'1px solid #c09020'}}>追加</button>
    </Modal>

    {/* 金額変更（今月／恒久） */}
    <Modal open={!!mOvr} onClose={()=>{setMOvr(null);setFOvr('');}} title={`金額を変更：${mOvr?.name||''}`}>
      <div style={{background:'rgba(255,255,255,0.04)',borderRadius:'8px',padding:'10px 12px',marginBottom:'14px',fontSize:'13px',color:'#a0a0c0'}}>
        現在の金額：¥{Number(mOvr?effBase(mOvr):0).toLocaleString()}
      </div>
      <Field label="新しい金額" value={fOvr} onChange={setFOvr} type="number" placeholder="0"/>
      <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
        <button onClick={saveOvrMonth} style={{...PB,justifyContent:'center',background:'linear-gradient(135deg,#7a5a00,#a07010)',border:'1px solid #b08020'}}>
          今月だけ変更
        </button>
        <button onClick={savePerm} style={{...PB,justifyContent:'center',background:'linear-gradient(135deg,#1a5a3a,#2a8a5a)',border:'1px solid #3aaa6a'}}>
          {cy}年{cm+1}月から恒久変更
        </button>
        <div style={{fontSize:'11px',color:'#505070',textAlign:'center'}}>
          ※恒久変更：この月以降ずっと新金額が適用されます。過去の月は変わりません。
        </div>
        <button onClick={()=>{setMOvr(null);setFOvr('');}} style={{background:'transparent',border:'1px solid #3d3d5e',color:'#808090',borderRadius:'8px',padding:'10px',cursor:'pointer',fontSize:'14px',WebkitAppearance:'none'}}>キャンセル</button>
      </div>
    </Modal>

    {/* メモ追加 */}
    <Modal open={mMemo} onClose={()=>setMMemo(false)} title="支払予定メモを追加">
      <Field label="予定日" value={fMemo.date} onChange={v=>setFMemo(f=>({...f,date:v}))} type="date"/>
      <Field label="タイトル" value={fMemo.title} onChange={v=>setFMemo(f=>({...f,title:v}))} placeholder="例: 年払い保険"/>
      <Field label="金額（任意）" value={fMemo.amt} onChange={v=>setFMemo(f=>({...f,amt:v}))} type="number" placeholder="0"/>
      <Field label="メモ（任意）" value={fMemo.note} onChange={v=>setFMemo(f=>({...f,note:v}))} placeholder="詳細を入力"/>
      <button onClick={addMemo} style={{...PB,width:'100%',justifyContent:'center'}}>追加</button>
    </Modal>
  </div>;
}

function MemoCard({memo,onDel,past}){
  return <div style={{background:past?'rgba(255,255,255,0.02)':'rgba(192,180,255,0.05)',border:`1px solid ${past?'#1d1d3a':'#3d3d6e'}`,borderRadius:'10px',padding:'12px 14px',marginBottom:'8px',opacity:past?0.6:1}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div>
        <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'4px'}}>
          <span style={{fontSize:'12px',fontFamily:"'Space Mono',monospace",color:'#8080c0'}}>{memo.date.replace(/-/g,'/')}</span>
          <span style={{fontSize:'14px',color:'#e0e0ff'}}>{memo.title}</span>
        </div>
        {memo.amt&&<div style={{fontSize:'14px',fontFamily:"'Space Mono',monospace",color:'#c0b4ff'}}>¥{Number(memo.amt).toLocaleString()}</div>}
        {memo.note&&<div style={{fontSize:'12px',color:'#6060a0',marginTop:'4px'}}>{memo.note}</div>}
      </div>
      <button onClick={()=>onDel(memo.id)} style={{background:'none',border:'1px solid #3d3d5e',color:'#606080',borderRadius:'6px',padding:'6px 10px',cursor:'pointer',fontSize:'13px',flexShrink:0,WebkitAppearance:'none'}}>削除</button>
    </div>
  </div>;
}

// ===== ROOT =====
function Root(){
  const [unlocked,setUnlocked]=useState(false);
  useEffect(()=>{
    // PINリセットフラグ処理
    const v=S.get('kpin')?.value;
    if(v==='__reset__'){S.del('kpin');}
  },[]);
  const hasPin=S.get('kpin')?.value&&S.get('kpin')?.value!=='__reset__';
  if(!unlocked&&hasPin)return <PinLock onUnlock={()=>setUnlocked(true)}/>;
  if(!unlocked&&!hasPin)return <PinLock onUnlock={()=>setUnlocked(true)}/>;
  return <App/>;
}

const root=ReactDOM.createRoot(document.getElementById('app'));
root.render(<Root/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
